---
- name: Install WireGuard and related packages
  ansible.builtin.apt:
    name: "{{ __wireguard_packages }}"
    update_cache: true
    state: present

- name: Import server.yaml
  ansible.builtin.import_tasks: server.yaml

- name: Import peer.yaml
  ansible.builtin.import_tasks: peer.yaml
  when: wireguard_peers | length > 0

- name: Apply wg_peer_add from template
  ansible.builtin.template:
    src: wg_peer_add.j2
    dest: /usr/local/bin/wg_peer_add
    owner: root
    group: root
    mode: '755'

- name: Apply wg_peer_remove from template
  ansible.builtin.template:
    src: wg_peer_remove.j2
    dest: /usr/local/bin/wg_peer_remove
    owner: root
    group: root
    mode: '755'
